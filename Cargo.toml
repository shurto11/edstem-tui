[package]
name = "edstem-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
unicode-width = "0.2"
roxmltree = "0.20"
chrono = { version = "0.4.45", default-features = false, features = ["now"] }

[profile.release]
opt-level = 3
